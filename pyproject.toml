[project]
name = "service-directory"
version = "0.1.0"
description = "Tiny config-driven service registry web dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyyaml>=6.0",
    "httpx2>=2.12",
]

[project.scripts]
service-directory = "service_directory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/service_directory"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx2>=2.12",
]

[tool.pytest.ini_options]
# A brand-new project ships warning-clean: deprecation warnings fail the suite,
# so regressions of this class can't creep back in silently.
filterwarnings = ["error::DeprecationWarning"]
