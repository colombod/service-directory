<style>*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--amp-page);color:var(--amp-ink);font-family:var(--font-ui);font-size:var(--text-md)}button{font-family:inherit}a{color:var(--amp-interactive);text-decoration:none}a:hover{color:var(--amp-interactive-hover)}::placeholder{color:var(--amp-ink-dim);opacity:1}::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:var(--amp-line);border-radius:999px}::-webkit-scrollbar-track{background:transparent}@keyframes amp-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.82)}}</style>
