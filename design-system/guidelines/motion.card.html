<!-- @dsCard group="Space & Shape" viewport="700x140" name="Motion" subtitle="Motion confirms a state change; it never performs" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:14px 16px; background:var(--bg); color:var(--text);
         font-family:var(--font-ui); font-size:var(--text-md); }
  .row { display:flex; gap:var(--space-md); flex-wrap:wrap; align-items:flex-start; }
  .sw { display:flex; flex-direction:column; gap:6px; min-width:96px; }
  .chipbox { height:46px; border-radius:var(--radius-sm); border:1px solid var(--border); }
  .lbl { font-size:var(--text-xs); color:var(--text-muted); font-family:var(--font-mono); }
  .val { font-size:var(--text-2xs); color:var(--text-dim); font-family:var(--font-mono); }
  .note { font-size:var(--text-xs); color:var(--text-dim); margin-top:10px; }
</style></head>
<body><div style="display:grid;gap:8px" class="val">
    <div><b style="color:var(--text)">--t-fast 150ms ease</b> — hover, focus, colour change</div>
    <div><b style="color:var(--text)">--t-fade 200ms ease</b> — appear / disappear</div>
    <div><b style="color:var(--text)">--t-zoom 250ms ease-in-out</b> — tile expand / collapse, sheet up</div>
    <div style="color:var(--text-muted)">Only two keyframe animations ship: <code>bell-pulse</code> (1.4s, infinite) and <code>sheet-up</code>.</div>
  </div></body></html>
