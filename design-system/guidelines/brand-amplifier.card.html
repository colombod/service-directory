<!-- @dsCard group="Brand" viewport="700x180" name="Amplifier mark" subtitle="The ecosystem's shared identity asset — one file, never redrawn" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:14px 16px; background:var(--bg); color:var(--text);
         font-family:var(--font-ui); font-size:var(--text-md); }
  .row { display:flex; gap:var(--space-md); flex-wrap:wrap; align-items:flex-start; }
  .sw { display:flex; flex-direction:column; gap:6px; min-width:96px; }
  .chipbox { height:46px; border-radius:var(--radius-sm); border:1px solid var(--border); }
  .lbl { font-size:var(--text-xs); color:var(--text-muted); font-family:var(--font-mono); }
  .val { font-size:var(--text-2xs); color:var(--text-dim); font-family:var(--font-mono); }
  .note { font-size:var(--text-xs); color:var(--text-dim); margin-top:10px; }
</style></head>
<body><div class="row" style="align-items:center;gap:20px">
    <img src="../assets/amplifier/amplifier-icon-48.png" alt="Amplifier" width="48" height="48">
    <button style="display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--border);border-radius:4px;color:var(--text-muted);font-family:var(--font-ui);font-size:13px;padding:4px 10px;cursor:default">
      <img src="../assets/amplifier/amplifier-icon-32.png" alt="" width="16" height="16">Agent
    </button>
    <span style="font-size:var(--text-xs);color:var(--text-dim)">Powered by <a href="#" style="color:var(--accent);text-decoration:none">Amplifier Agent</a></span>
  </div>
  <p class="note">assets/amplifier/amplifier-icon-32.png — rendered at 16×16 in chrome. Every Amplifier app uses this exact file; there is one logo asset, not a second one.</p></body></html>
