<!-- @dsCard group="Colors" viewport="700x170" name="Signal & attention" subtitle="Status only — never used to decorate a surface" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:14px 16px; background:var(--bg); color:var(--text);
         font-family:var(--font-ui); font-size:var(--text-md); }
  .row { display:flex; gap:var(--space-md); flex-wrap:wrap; align-items:flex-start; }
  .sw { display:flex; flex-direction:column; gap:6px; min-width:96px; }
  .chipbox { height:46px; border-radius:var(--radius-sm); border:1px solid var(--border); }
  .lbl { font-size:var(--text-xs); color:var(--text-muted); font-family:var(--font-mono); }
  .val { font-size:var(--text-2xs); color:var(--text-dim); font-family:var(--font-mono); }
  .note { font-size:var(--text-xs); color:var(--text-dim); margin-top:10px; }
</style></head>
<body><div class="row">
    <div class="sw" style="flex:1"><div class="chipbox" style="background:#3fb950"></div><span class="lbl">--ok</span><span class="val">#3fb950</span></div><div class="sw" style="flex:1"><div class="chipbox" style="background:#d29922"></div><span class="lbl">--warn</span><span class="val">#d29922</span></div><div class="sw" style="flex:1"><div class="chipbox" style="background:#f85149"></div><span class="lbl">--err</span><span class="val">#f85149</span></div><div class="sw" style="flex:1"><div class="chipbox" style="background:#F1A640"></div><span class="lbl">--bell</span><span class="val">#F1A640</span></div>
  </div>
  <div class="row" style="margin-top:10px">
    <div style="flex:1;height:34px;border-radius:var(--radius-sm);border:1px solid var(--bell-border);border-left:3px solid var(--bell);box-shadow:var(--glow-bell);background:var(--bg-secondary);display:flex;align-items:center;gap:6px;padding:0 8px">
      <span style="min-width:16px;height:16px;border-radius:8px;background:var(--bell);color:#0D1117;font-size:9px;font-weight:700;display:inline-flex;align-items:center;justify-content:center">3</span>
      <span class="lbl" style="color:var(--text)">bell state = colour + border + glow</span>
    </div>
  </div></body></html>
