<!-- @dsCard group="Colors" viewport="700x140" name="Accent" subtitle="One colour, one meaning: this is interactive" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:14px 16px; background:var(--bg); color:var(--text);
         font-family:var(--font-ui); font-size:var(--text-md); }
  .row { display:flex; gap:var(--space-md); flex-wrap:wrap; align-items:flex-start; }
  .sw { display:flex; flex-direction:column; gap:6px; min-width:96px; }
  .chipbox { height:46px; border-radius:var(--radius-sm); border:1px solid var(--border); }
  .lbl { font-size:var(--text-xs); color:var(--text-muted); font-family:var(--font-mono); }
  .val { font-size:var(--text-2xs); color:var(--text-dim); font-family:var(--font-mono); }
  .note { font-size:var(--text-xs); color:var(--text-dim); margin-top:10px; }
</style></head>
<body><div class="row">
    <div class="sw" style="flex:1"><div class="chipbox" style="background:#00D9F5"></div><span class="lbl">--accent</span><span class="val">#00D9F5<br>rest</span></div><div class="sw" style="flex:1"><div class="chipbox" style="background:#00b8d1"></div><span class="lbl">--accent-hover</span><span class="val">#00b8d1<br>hover / focus / expanded</span></div><div class="sw" style="flex:1"><div class="chipbox" style="background:rgba(0,217,245,0.15)"></div><span class="lbl">--accent-dim</span><span class="val">rgba(0,217,245,0.15)<br>fill behind accent text</span></div>
  </div></body></html>
