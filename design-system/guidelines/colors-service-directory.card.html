<!-- @dsCard group="Colors" viewport="700x175" name="Service Directory palette" subtitle="The second surface: light-first, scoped, never mixed with muxplex names" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:14px 16px; background:var(--bg); color:var(--text);
         font-family:var(--font-ui); font-size:var(--text-md); }
  .row { display:flex; gap:var(--space-md); flex-wrap:wrap; align-items:flex-start; }
  .sw { display:flex; flex-direction:column; gap:6px; min-width:96px; }
  .chipbox { height:46px; border-radius:var(--radius-sm); border:1px solid var(--border); }
  .lbl { font-size:var(--text-xs); color:var(--text-muted); font-family:var(--font-mono); }
  .val { font-size:var(--text-2xs); color:var(--text-dim); font-family:var(--font-mono); }
  .note { font-size:var(--text-xs); color:var(--text-dim); margin-top:10px; }
</style></head>
<body><div data-product="service-directory" style="background:var(--sd-bg);padding:12px;border-radius:var(--radius-sm);border:1px solid var(--sd-border)">
    <div class="row">
      <div class="sw" style="flex:1;min-width:80px"><div class="chipbox" style="background:#3355d1;border-color:#cdd2da"></div><span class="lbl" style="color:#56606e">--sd-accent</span><span class="val" style="color:#838d9b">#3355d1</span></div><div class="sw" style="flex:1;min-width:80px"><div class="chipbox" style="background:#eef1fb;border-color:#cdd2da"></div><span class="lbl" style="color:#56606e">--sd-accent-weak</span><span class="val" style="color:#838d9b">#eef1fb</span></div><div class="sw" style="flex:1;min-width:80px"><div class="chipbox" style="background:#1b232f;border-color:#cdd2da"></div><span class="lbl" style="color:#56606e">--sd-text</span><span class="val" style="color:#838d9b">#1b232f</span></div><div class="sw" style="flex:1;min-width:80px"><div class="chipbox" style="background:#f6f7f9;border-color:#cdd2da"></div><span class="lbl" style="color:#56606e">--sd-alt</span><span class="val" style="color:#838d9b">#f6f7f9</span></div><div class="sw" style="flex:1;min-width:80px"><div class="chipbox" style="background:#1f9d55;border-color:#cdd2da"></div><span class="lbl" style="color:#56606e">--sd-up</span><span class="val" style="color:#838d9b">#1f9d55</span></div><div class="sw" style="flex:1;min-width:80px"><div class="chipbox" style="background:#d23b3b;border-color:#cdd2da"></div><span class="lbl" style="color:#56606e">--sd-down</span><span class="val" style="color:#838d9b">#d23b3b</span></div>
    </div>
  </div>
  <p class="note">Scope with <code>data-product="service-directory"</code>. Two palettes must never share a name.</p></body></html>
