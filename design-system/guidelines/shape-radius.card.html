<!-- @dsCard group="Space & Shape" viewport="700x150" name="Radius" subtitle="4px is 63% of all radii — the default for everything" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:14px 16px; background:var(--bg); color:var(--text);
         font-family:var(--font-ui); font-size:var(--text-md); }
  .row { display:flex; gap:var(--space-md); flex-wrap:wrap; align-items:flex-start; }
  .sw { display:flex; flex-direction:column; gap:6px; min-width:96px; }
  .chipbox { height:46px; border-radius:var(--radius-sm); border:1px solid var(--border); }
  .lbl { font-size:var(--text-xs); color:var(--text-muted); font-family:var(--font-mono); }
  .val { font-size:var(--text-2xs); color:var(--text-dim); font-family:var(--font-mono); }
  .note { font-size:var(--text-xs); color:var(--text-dim); margin-top:10px; }
</style></head>
<body><div class="row">
    <div class="sw" style="flex:1"><div style="height:46px;background:var(--bg-surface);border:1px solid var(--border);border-radius:4px"></div><span class="lbl">--radius-sm</span><span class="val">4px · controls, tiles, cards</span></div><div class="sw" style="flex:1"><div style="height:46px;background:var(--bg-surface);border:1px solid var(--border);border-radius:8px"></div><span class="lbl">--radius-md</span><span class="val">8px · menus, dialogs</span></div><div class="sw" style="flex:1"><div style="height:46px;background:var(--bg-surface);border:1px solid var(--border);border-radius:12px"></div><span class="lbl">--radius-lg</span><span class="val">12px · mobile sheets</span></div><div class="sw" style="flex:1"><div style="height:46px;background:var(--bg-surface);border:1px solid var(--border);border-radius:999px"></div><span class="lbl">--radius-pill</span><span class="val">999px · badges only</span></div>
  </div></body></html>
