<!-- @dsCard group="Type" viewport="700x175" name="Font stacks" subtitle="No webfont is loaded by the app — Urbanist appears only in the brand SVGs" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:14px 16px; background:var(--bg); color:var(--text);
         font-family:var(--font-ui); font-size:var(--text-md); }
  .row { display:flex; gap:var(--space-md); flex-wrap:wrap; align-items:flex-start; }
  .sw { display:flex; flex-direction:column; gap:6px; min-width:96px; }
  .chipbox { height:46px; border-radius:var(--radius-sm); border:1px solid var(--border); }
  .lbl { font-size:var(--text-xs); color:var(--text-muted); font-family:var(--font-mono); }
  .val { font-size:var(--text-2xs); color:var(--text-dim); font-family:var(--font-mono); }
  .note { font-size:var(--text-xs); color:var(--text-dim); margin-top:10px; }
</style></head>
<body><div style="display:grid;gap:10px">
    <div><span class="lbl">--font-ui</span><div style="font-family:var(--font-ui);font-size:16px">system-ui · Segoe UI · sans-serif — every pixel of chrome</div></div>
    <div><span class="lbl">--font-mono</span><div style="font-family:var(--font-mono);font-size:16px">SF Mono · Fira Code · Consolas — terminal output only</div></div>
    <div><span class="lbl">--font-brand</span><div style="font-family:var(--font-brand);font-size:16px;font-weight:700">Urbanist 700 — wordmark and lockup artwork, never UI</div></div>
  </div></body></html>
