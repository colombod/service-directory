host_addresses:
  - {label: "Tailnet", host: "100.111.191.22"}   # tailnet-first (precedence)
  - {label: "LAN",     host: "192.168.1.86"}
  # `scheme` is OPTIONAL on every host_addresses entry (allowed: "http" |
  # "https", default "http" when omitted) -- shown here commented out on
  # an example third address so a plain two-address config still loads
  # and renders identically to a legacy config with no scheme at all.
  # - {label: "Tailnet (TLS)", host: "100.111.191.22", scheme: "https"}
services:
  # Richer metadata fields (category, tags, icon, owner, docs_url, scheme)
  # are ALL optional -- shown here on one entry as an example; every other
  # entry below omits them entirely and loads identically to a legacy
  # config. `scheme` on a SERVICE is an override that wins over the host
  # address's own scheme when a particular service needs to be reached
  # differently (e.g. it terminates TLS itself even though other services
  # on the same host address don't).
  # (scheme: "https" could be added here too, e.g. `scheme: "https"`, but is
  # left out so this shipped sample keeps resolving to plain http:// links.)
  - {name: "Resolve",              port: 8080, path: "/", description: "Amplifier Resolve dot-graph pipeline runner", category: "pipelines", tags: ["video", "editor"], icon: "🎬", owner: "amplifier-team", docs_url: "https://example.invalid/docs/resolve"}
  - {name: "Context Intelligence", port: 8000, path: "/"}
  - {name: "muxplex",              port: 8088}
  - {name: "muxterm",              port: 8311}
  - {name: "browser-bridge hub",   port: 8900}

# Block 2 -- Federation (optional, off by default). Each node keeps ONLY its
# own local config here; trusted peers are established via the pairing
# handshake (`service-directory token issue` / `service-directory pair`) and
# persisted separately to identity.json / peers.json in the state dir --
# never listed statically in this file.
# federation:
#   enabled: true
#   name: "this-node-name"                 # shown as the "origin" of local services
#   base_url: "http://100.111.191.22:80"   # tailnet-first, advertised to peers when pairing
#   state_dir: "/var/lib/service-directory" # default: ~/.local/state/service-directory
#   require_read_token: false              # true = /, /api/services, /api/health require a peer bearer token
#   description: "Home lab tailnet node"    # optional, advertised via /api/instance-info
#   role: "primary"                         # optional, advertised via /api/instance-info
#   allow_private_health_targets: false     # opt in to allow a dynamic entry's
#                                           # health_url/url to target loopback,
#                                           # link-local, or RFC1918-private
#                                           # addresses when polled by /api/health
#                                           # (default false -- blocked to avoid
#                                           # SSRF against internal services /
#                                           # cloud metadata endpoints)

# Dynamic service registry (additive, always on): agents/scripts/humans can
# register services at runtime via POST /api/services (or the CLI
# `register`/`deregister`/`heartbeat` commands), persisted to
# registry.json in the state dir. Every mutation requires a write token
# (`service-directory token issue-write`) UNLESS the request comes from
# localhost -- set require_write_token: true below to require a token even
# on localhost.
#   require_write_token: false
